{% from "_icons.html" import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#17110d">
  <title>Minecraft Booter</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body class="login-page">
  <main class="card card-narrow" role="main">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
        </svg>
      </span>
      <div>
        <h1>Minecraft Booter</h1>
        <p class="muted">Boot the Better MC server without an AWS key.</p>
      </div>
    </div>

    {% if error %}
    <p class="alert alert-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field" for="password">
        <span class="field-label">Password</span>
        <span class="field-input">
          <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
          <button type="button" class="reveal" data-reveal="password" aria-label="Show password">
            <span data-eye-show>{{ icon('eye') }}</span>
            <span data-eye-hide hidden>{{ icon('eye-off') }}</span>
          </button>
        </span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">{{ icon('unlock') }} Unlock</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
